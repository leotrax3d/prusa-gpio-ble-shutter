<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<rect width="1100" height="650" fill="#11161c"/>
<g font-family="sans-serif" fill="#edf1f4"><text x="50" y="55" font-size="28">CORE One → Hackerboard → ESP32 → Smartphone</text>
<text x="50" y="88" font-size="16">Anschlussplan · ESP32-WROOM-32 / DevKit · 3,3-V-Signal</text>
<g fill="#1b232d" stroke="#637180" stroke-width="2"><rect x="50" y="160" width="290" height="270" rx="15"/><rect x="690" y="160" width="350" height="270" rx="15"/></g>
<text x="75" y="200" font-size="24">Prusa GPIO Hackerboard</text><text x="75" y="232" font-size="16">I²C-Kabel zum CORE One</text>
<text x="75" y="290" font-size="19">J6 Pin 9 · OUT7</text><text x="75" y="370" font-size="19">J6 Pin 10 · GND</text>
<text x="720" y="200" font-size="24">ESP32 Dev Board</text><text x="720" y="232" font-size="16">Versorgung über eigenen USB-Anschluss</text>
<text x="720" y="290" font-size="19">GPIO27 · Eingang</text><text x="720" y="370" font-size="19">GND</text>
<path d="M340 285H450m80 0H690" stroke="#ef7829" stroke-width="4" fill="none"/><path d="M450 275h80v20h-80z" stroke="#ef7829" fill="none" stroke-width="3"/>
<text x="465" y="260" font-size="17">optional 1 kΩ</text><path d="M340 365H690" stroke="#a7bdcd" stroke-width="4"/>
<text x="390" y="403" font-size="16">Gemeinsame Masse</text>
<text x="50" y="485" font-size="19">JP7 darf offen bleiben: ESP32 nutzt INPUT_PULLUP.</text>
<text x="50" y="520" font-size="19">Ohne Widerstand: OUT7 direkt mit GPIO27 verbinden.</text>
<text x="50" y="555" font-size="19">Versorgung nur per USB. Keine Verbindung zwischen 3V3 / 5V / VIN der Platinen.</text>
<text x="50" y="600" font-size="15">J6-Nummern gelten für Prusa FDM-MK4-Gpio Rev02 BOM05. Beschriftung / Revision vor Anschluss prüfen.</text>
</g></svg>
