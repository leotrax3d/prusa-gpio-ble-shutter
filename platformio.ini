; Arduino-ESP32 3.x via pioarduino (PlatformIO's official espressif32 platform stops at 2.0.x).
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags =
  -std=gnu++17
  -D FIRMWARE_VERSION=\"3.0.0\"
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  h2zero/NimBLE-Arduino@2.5.2
extra_scripts = pre:scripts/embed.py
